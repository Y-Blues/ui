[project]
name = "ycappuccino-ui"
version = "0.1.0"
description = "YCappuccino ui: a backend-agnostic, declarative description of a form-like screen (fields + actions), rendered by separate adapters (Qt, shell, web)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "ycappuccino-api",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ycappuccino.ui"
module-root = "src/main/python"

[tool.uv.sources]
ycappuccino-api = { path = "../api", editable = true }
